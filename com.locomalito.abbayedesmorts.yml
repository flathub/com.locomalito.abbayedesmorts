app-id: com.locomalito.abbayedesmorts
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: abbayev2
rename-desktop-file: abbaye.desktop
rename-icon: abbaye
finish-args:
  - --device=dri
  - --share=ipc
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
modules:
  - shared-modules/SDL2/SDL2_image.json
  - shared-modules/SDL2/SDL2_mixer.json
  - name: abbayedesmorts
    buildsystem: simple
    build-options:
      # SDL2_image installs its header under /app/include/SDL2, but abbayedesmorts
      # includes it bare (<SDL_image.h>); sdl2-config only points at the runtime's
      # /usr/include/SDL2, so add the app one explicitly.
      cflags: -I/app/include/SDL2
    build-commands:
      - make PREFIX=${FLATPAK_DEST}
      - make install PREFIX=${FLATPAK_DEST}
    post-install:
      - install -Dm0644 abbaye.svg -t ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/
      - install -Dm0644 ${FLATPAK_ID}.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo/
    cleanup:
      - /share/appdata
    sources:
      - type: git
        url: https://github.com/nevat/abbayedesmorts-gpl.git
        tag: v2.0.5
        commit: 22fabef3d5abb8d84867cf9ae5b82d4795da03f6
        x-checker-data:
          is-main-source: true
          type: git
          tag-pattern: ^v([\d.]+)$
      - type: file
        path: abbaye.svg
      - type: file
        path: com.locomalito.abbayedesmorts.metainfo.xml
